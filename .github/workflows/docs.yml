# Build both language editions and publish them to GitHub Pages.
#
# Each language is a separate Sphinx project (``docs/ja``, ``docs/en``) because
# Sphinx resolves ``language`` once per build. ``make all`` builds both into
# ``_site/<lang>/`` and writes the root redirect.
name: docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (ja + en)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install documentation dependencies
        run: uv sync --group docs
      # The figures are written by scripts/figures. Writing them all afresh
      # fails this when an SVG was edited by hand, has no script, or was left
      # out of the commit, or when a script changed without `make figures`.
      - name: Check that the figures match their scripts
        run: |
          rm -f docs/ja/figures/*.svg
          make figures
          test -z "$(git status --porcelain -- docs/ja/figures)"
      # -W turns warnings into errors: both editions currently build clean, and
      # this keeps broken directives or unresolved references from landing.
      - name: Build both editions
        run: make all SPHINXOPTS="-W --keep-going"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  linkcheck:
    name: Link check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Advisory only: publishers routinely rate-limit or block DOI resolution
    # from CI, so a failure here reports rather than blocks.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install documentation dependencies
        run: uv sync --group docs
      - name: Check external links
        run: make linkcheck

  deploy:
    name: Deploy to Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
