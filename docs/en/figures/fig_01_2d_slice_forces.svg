<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" role="img" aria-labelledby="title desc">
  <title id="title">Free-body diagram of a 2D slice</title>
  <desc id="desc">A slice with vertical sides and an inclined base carries its weight, the normal and shear forces on its base, and the interslice forces on its two sides. The figure also shows the inclination of the base, the width of the slice, the heights at which the interslice forces act, the outward normal and the assumed direction of sliding.</desc>
