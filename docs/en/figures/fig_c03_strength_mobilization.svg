<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
  <title id="title">Shear strength by the Mohr–Coulomb failure criterion, and the mobilized shear stress</title>
  <desc id="desc">The Mohr–Coulomb line for c′=10 kPa, ϕ′=30°, on a plot of shear stress against effective normal stress. For the two states of the worked example in Section 6, it shows the available shear strength τf and the mobilized shear stress τm=30 kPa. When the water table rises and the effective normal stress falls from 60 kPa to 40 kPa, τf falls from 44.6 kPa to 33.1 kPa, and the factor of safety falls from 1.49 to 1.10.</desc>
  <style>.t{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:'STIX Two Text','Cambria','Times New Roman',serif}</style>
  <rect width="760" height="390" fill="#fff"/>
  <line x1="92" y1="330" x2="659" y2="330" stroke="#172033" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="92" y1="330" x2="92" y2="33" stroke="#172033" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="653.6" y1="330" x2="672.1" y2="330" stroke="#172033" stroke-width="1.4" stroke-linecap="butt"/>
  <polygon points="675.2,330 667.4,333.8 667.4,326.2" fill="#172033" stroke-linejoin="round"/>
