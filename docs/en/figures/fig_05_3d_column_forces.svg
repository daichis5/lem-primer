<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title desc">
  <title id="title">Forces on a 3D column</title>
  <desc id="desc">A 3D column with an inclined base carries its weight, the normal and shear forces on its base, and the intercolumn forces on its sides. The base shear force is a vector in the tangent plane, and the strength equation does not fix its direction. The dotted circle shows the directions it can take in the tangent plane.</desc>
