  <text x="694" y="59" class="m" font-size="15" fill="#172033" text-anchor="end"><tspan font-style="italic">F</tspan><tspan dy="4.2" font-size="10.5" font-style="italic">f</tspan><tspan dy="-4.2" font-style="normal" class="t" font-size="14">：力のつり合い</tspan></text>
  <circle cx="92" cy="161.2" r="5" fill="#fff" stroke="#172033" stroke-width="2"/>
  <text x="104" y="147.2" class="t" font-size="13" fill="#172033" text-anchor="start">簡易Bishop法</text>
  <circle cx="92" cy="264.3" r="5" fill="#fff" stroke="#172033" stroke-width="2"/>
  <text x="104" y="284.3" class="t" font-size="13" fill="#172033" text-anchor="start">簡易Janbu法</text>
  <circle cx="462.3" cy="163" r="5" fill="#fff" stroke="#172033" stroke-width="2"/>
  <text x="452.3" y="147" class="t" font-size="13" fill="#172033" text-anchor="end">Spencer法</text>
