<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">スライス間力の合力の傾きと，2つのつり合いから求めた安全率</title>
  <desc id="desc">第1章の図1の円弧で，スライス間力の合力の傾き θ を決定して，モーメントのつり合いから求めた安全率 F_m と，力のつり合いから求めた安全率 F_f を描いた図．θ = 0 の F_m は簡易Bishop法，F_f は簡易Janbu法の値で，2本の曲線が交わる点がSpencer法の解である．</desc>
  <style>.t{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif}.m{font-family:'STIX Two Text','Cambria','Times New Roman',serif}</style>
  <rect width="760" height="360" fill="#fff"/>
  <line x1="92" y1="300" x2="700" y2="300" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round"/>
  <text x="82" y="304.7" class="t" font-size="13" fill="#475569" text-anchor="end">1.8</text>
  <line x1="92" y1="247.2" x2="700" y2="247.2" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round"/>
  <text x="82" y="251.9" class="t" font-size="13" fill="#475569" text-anchor="end">1.9</text>
  <line x1="92" y1="194.4" x2="700" y2="194.4" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round"/>
  <text x="82" y="199.1" class="t" font-size="13" fill="#475569" text-anchor="end">2.0</text>
  <line x1="92" y1="141.6" x2="700" y2="141.6" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round"/>
  <text x="82" y="146.3" class="t" font-size="13" fill="#475569" text-anchor="end">2.1</text>
  <line x1="92" y1="88.8" x2="700" y2="88.8" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round"/>
  <text x="82" y="93.5" class="t" font-size="13" fill="#475569" text-anchor="end">2.2</text>
  <line x1="92" y1="36" x2="700" y2="36" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round"/>
  <text x="82" y="40.7" class="t" font-size="13" fill="#475569" text-anchor="end">2.3</text>
  <line x1="92" y1="300" x2="92" y2="305" stroke="#475569" stroke-width="1" stroke-linecap="round"/>
  <text x="92" y="322" class="t" font-size="13" fill="#475569" text-anchor="middle">0</text>
  <line x1="193.3" y1="300" x2="193.3" y2="305" stroke="#475569" stroke-width="1" stroke-linecap="round"/>
  <text x="193.3" y="322" class="t" font-size="13" fill="#475569" text-anchor="middle">5</text>
  <line x1="294.7" y1="300" x2="294.7" y2="305" stroke="#475569" stroke-width="1" stroke-linecap="round"/>
  <text x="294.7" y="322" class="t" font-size="13" fill="#475569" text-anchor="middle">10</text>
  <line x1="396" y1="300" x2="396" y2="305" stroke="#475569" stroke-width="1" stroke-linecap="round"/>
  <text x="396" y="322" class="t" font-size="13" fill="#475569" text-anchor="middle">15</text>
  <line x1="497.3" y1="300" x2="497.3" y2="305" stroke="#475569" stroke-width="1" stroke-linecap="round"/>
  <text x="497.3" y="322" class="t" font-size="13" fill="#475569" text-anchor="middle">20</text>
  <line x1="598.7" y1="300" x2="598.7" y2="305" stroke="#475569" stroke-width="1" stroke-linecap="round"/>
  <text x="598.7" y="322" class="t" font-size="13" fill="#475569" text-anchor="middle">25</text>
  <line x1="700" y1="300" x2="700" y2="305" stroke="#475569" stroke-width="1" stroke-linecap="round"/>
  <text x="700" y="322" class="t" font-size="13" fill="#475569" text-anchor="middle">30</text>
  <line x1="92" y1="300" x2="700" y2="300" stroke="#172033" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="92" y1="300" x2="92" y2="36" stroke="#172033" stroke-width="1.4" stroke-linecap="round"/>
  <text x="396" y="348" class="m" font-size="15" fill="#475569" text-anchor="middle"><tspan font-style="normal" class="t" font-size="14">スライス間力の合力の傾き </tspan><tspan font-style="italic">θ</tspan><tspan font-style="normal" class="t" font-size="14"> [°]</tspan></text>
  <text x="40" y="24" class="m" font-size="15" fill="#475569" text-anchor="start"><tspan font-style="italic">F</tspan><tspan dy="4.2" font-size="10.5" font-style="italic">s</tspan></text>
