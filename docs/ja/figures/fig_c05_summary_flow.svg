<svg xmlns="http://www.w3.org/2000/svg" width="760" height="748" viewBox="0 0 760 748" role="img" aria-labelledby="title desc">
  <title id="title">連続体の応力から安全率までの流れ</title>
  <desc id="desc">1節から9節の段階を，上から順に箱で示す．各箱には，節，量，式を並べている．箱の間の矢印には，次の段階に進むときに使う式や行う操作を書いている．1節から6節は点ごとの応力を，7節から9節はスライスやカラムごとの合力を扱う．</desc>
  <style>.t{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif}.m{font-family:'STIX Two Text','Cambria','Times New Roman',serif}</style>
  <rect width="760" height="748" fill="#fff"/>
  <rect x="76" y="16" width="608" height="512" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="90" y="38" class="t" font-size="13" fill="#475569" text-anchor="start">点ごとの応力</text>
  <rect x="76" y="556" width="608" height="176" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="90" y="578" class="t" font-size="13" fill="#475569" text-anchor="start">スライスやカラムごとの合力</text>
  <rect x="100" y="50" width="560" height="44" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="116" y="76.7" class="t" font-size="13" fill="#475569" text-anchor="start">1節</text>
  <text x="180" y="77" class="t" font-size="14" fill="#172033" text-anchor="start">応力場と各点のつり合い</text>
  <text x="470" y="77.6" class="m" font-size="17" fill="#172033" text-anchor="start"><tspan font-style="italic" font-weight="bold">σ</tspan><tspan font-style="normal">,  ∇·</tspan><tspan font-style="italic" font-weight="bold">σ</tspan><tspan font-style="normal"> + </tspan><tspan font-style="italic">ρ</tspan><tspan font-style="italic" font-weight="bold">b</tspan><tspan font-style="normal"> = </tspan><tspan font-style="normal" font-weight="bold">0</tspan></text>
  <rect x="100" y="134" width="560" height="44" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="116" y="160.7" class="t" font-size="13" fill="#475569" text-anchor="start">2節</text>
  <text x="180" y="161" class="t" font-size="14" fill="#172033" text-anchor="start">すべり面上の表面力</text>
  <text x="470" y="161.6" class="m" font-size="17" fill="#172033" text-anchor="start"><tspan font-style="italic" font-weight="bold">t</tspan><tspan font-style="normal"> = </tspan><tspan font-style="italic" font-weight="bold">σn</tspan></text>
  <rect x="100" y="218" width="560" height="44" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="116" y="244.7" class="t" font-size="13" fill="#475569" text-anchor="start">3節</text>
  <text x="180" y="245" class="t" font-size="14" fill="#172033" text-anchor="start">垂直応力とせん断応力</text>
  <text x="470" y="245.6" class="m" font-size="17" fill="#172033" text-anchor="start"><tspan font-style="italic">σ</tspan><tspan dy="4.8" font-size="11.9" font-style="italic">n</tspan><tspan dy="-4.8" font-style="normal">,  </tspan><tspan font-style="italic" font-weight="bold">τ</tspan></text>
  <rect x="100" y="302" width="560" height="44" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="116" y="328.7" class="t" font-size="13" fill="#475569" text-anchor="start">4節</text>
  <text x="180" y="329" class="t" font-size="14" fill="#172033" text-anchor="start">有効垂直応力</text>
  <text x="470" y="329.6" class="m" font-size="17" fill="#172033" text-anchor="start"><tspan font-style="italic">σ</tspan><tspan font-style="normal">′</tspan><tspan dy="4.8" font-size="11.9" font-style="italic">n</tspan><tspan dy="-4.8" font-style="normal"> = </tspan><tspan font-style="italic">σ</tspan><tspan dy="4.8" font-size="11.9" font-style="italic">n</tspan><tspan dy="-4.8" font-style="normal"> − </tspan><tspan font-style="italic">u</tspan></text>
  <rect x="100" y="386" width="560" height="44" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="116" y="412.7" class="t" font-size="13" fill="#475569" text-anchor="start">5節</text>
  <text x="180" y="413" class="t" font-size="14" fill="#172033" text-anchor="start">せん断強度</text>
  <text x="470" y="413.6" class="m" font-size="17" fill="#172033" text-anchor="start"><tspan font-style="italic">τ</tspan><tspan dy="4.8" font-size="11.9" font-style="italic">f</tspan><tspan dy="-4.8" font-style="normal"> = </tspan><tspan font-style="italic">c</tspan><tspan font-style="normal">′ + </tspan><tspan font-style="italic">σ</tspan><tspan font-style="normal">′</tspan><tspan dy="4.8" font-size="11.9" font-style="italic">n</tspan><tspan dy="-4.8" font-style="normal"> tan </tspan><tspan font-style="italic">ϕ</tspan><tspan font-style="normal">′</tspan></text>
  <rect x="100" y="470" width="560" height="44" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="116" y="496.7" class="t" font-size="13" fill="#475569" text-anchor="start">6節</text>
  <text x="180" y="497" class="t" font-size="14" fill="#172033" text-anchor="start">動員せん断応力</text>
  <text x="470" y="497.6" class="m" font-size="17" fill="#172033" text-anchor="start"><tspan font-style="italic">τ</tspan><tspan dy="4.8" font-size="11.9" font-style="italic">m</tspan><tspan dy="-4.8" font-style="normal"> = </tspan><tspan font-style="italic">τ</tspan><tspan dy="4.8" font-size="11.9" font-style="italic">f</tspan><tspan dy="-4.8" font-style="normal"> / </tspan><tspan font-style="italic">F</tspan><tspan dy="4.8" font-size="11.9" font-style="italic">s</tspan></text>
  <rect x="100" y="590" width="560" height="44" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="116" y="616.7" class="t" font-size="13" fill="#475569" text-anchor="start">7・8節</text>
  <text x="180" y="617" class="t" font-size="14" fill="#172033" text-anchor="start">底面に働く合力</text>
  <text x="470" y="617.6" class="m" font-size="17" fill="#172033" text-anchor="start"><tspan font-style="italic">N</tspan><tspan dy="4.8" font-size="11.9" font-style="italic">i</tspan><tspan dy="-4.8" font-style="normal">,  </tspan><tspan font-style="italic">U</tspan><tspan dy="4.8" font-size="11.9" font-style="italic">i</tspan><tspan dy="-4.8" font-style="normal">,  </tspan><tspan font-style="italic">T</tspan><tspan dy="4.8" font-size="11.9" font-style="italic">i</tspan></text>
  <rect x="100" y="674" width="560" height="44" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="116" y="700.7" class="t" font-size="13" fill="#475569" text-anchor="start">9節</text>
  <text x="180" y="701" class="t" font-size="14" fill="#172033" text-anchor="start">安全率と各合力</text>
  <text x="470" y="701.6" class="m" font-size="17" fill="#172033" text-anchor="start"><tspan font-style="italic">F</tspan><tspan dy="4.8" font-size="11.9" font-style="italic">s</tspan><tspan dy="-4.8" font-style="normal">,  </tspan><tspan font-style="italic">N</tspan><tspan dy="4.8" font-size="11.9" font-style="italic">i</tspan><tspan dy="-4.8" font-style="normal">,  </tspan><tspan font-style="italic">T</tspan><tspan dy="4.8" font-size="11.9" font-style="italic">i</tspan></text>
  <line x1="380" y1="98" x2="380" y2="125.6" stroke="#475569" stroke-width="1.8" stroke-linecap="butt"/>
  <polygon points="380,130 374.7,118.9 385.3,118.9" fill="#475569" stroke-linejoin="round"/>
  <text x="394" y="118.3" class="m" font-size="13" fill="#475569" text-anchor="start"><tspan font-style="normal" class="t" font-size="13">Cauchyの公式</tspan></text>
  <line x1="380" y1="182" x2="380" y2="209.6" stroke="#475569" stroke-width="1.8" stroke-linecap="butt"/>
  <polygon points="380,214 374.7,202.9 385.3,202.9" fill="#475569" stroke-linejoin="round"/>
  <text x="394" y="202.3" class="m" font-size="13" fill="#475569" text-anchor="start"><tspan font-style="normal" class="t" font-size="13">法線成分とせん断成分に分ける</tspan></text>
  <line x1="380" y1="266" x2="380" y2="293.6" stroke="#475569" stroke-width="1.8" stroke-linecap="butt"/>
  <polygon points="380,298 374.7,286.9 385.3,286.9" fill="#475569" stroke-linejoin="round"/>
  <text x="394" y="286.3" class="m" font-size="13" fill="#475569" text-anchor="start"><tspan font-style="normal" class="t" font-size="13">間隙水圧 </tspan><tspan font-style="italic">u</tspan><tspan font-style="normal" class="t" font-size="13"> を引く</tspan></text>
  <line x1="380" y1="350" x2="380" y2="377.6" stroke="#475569" stroke-width="1.8" stroke-linecap="butt"/>
  <polygon points="380,382 374.7,370.9 385.3,370.9" fill="#475569" stroke-linejoin="round"/>
  <text x="394" y="370.3" class="m" font-size="13" fill="#475569" text-anchor="start"><tspan font-style="normal" class="t" font-size="13">Mohr–Coulomb則</tspan></text>
  <line x1="380" y1="434" x2="380" y2="461.6" stroke="#475569" stroke-width="1.8" stroke-linecap="butt"/>
  <polygon points="380,466 374.7,454.9 385.3,454.9" fill="#475569" stroke-linejoin="round"/>
  <text x="394" y="454.3" class="m" font-size="13" fill="#475569" text-anchor="start"><tspan font-style="normal" class="t" font-size="13">安全率 </tspan><tspan font-style="italic">F</tspan><tspan dy="3.6" font-size="9.1" font-style="italic">s</tspan><tspan dy="-3.6" font-style="normal" class="t" font-size="13"> で割る</tspan></text>
  <line x1="380" y1="518" x2="380" y2="581.6" stroke="#475569" stroke-width="1.8" stroke-linecap="butt"/>
  <polygon points="380,586 374.7,574.9 385.3,574.9" fill="#475569" stroke-linejoin="round"/>
  <text x="394" y="546.3" class="m" font-size="13" fill="#475569" text-anchor="start"><tspan font-style="normal" class="t" font-size="13">面積分と，底面ごとのモデル化</tspan></text>
  <line x1="380" y1="638" x2="380" y2="665.6" stroke="#475569" stroke-width="1.8" stroke-linecap="butt"/>
  <polygon points="380,670 374.7,658.9 385.3,658.9" fill="#475569" stroke-linejoin="round"/>
  <text x="394" y="658.3" class="m" font-size="13" fill="#475569" text-anchor="start"><tspan font-style="normal" class="t" font-size="13">つり合い式と，LEMに固有の仮定</tspan></text>
</svg>
