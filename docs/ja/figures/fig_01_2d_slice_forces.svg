<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">2次元スライスに作用する力の自由物体図</title>
  <desc id="desc">自重，底面法線力，底面抵抗せん断力，左右のスライス間法線力とせん断力，底面角度，外向き法線と想定すべり方向を示す．</desc>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="red" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d64545"/></marker>
    <marker id="green" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#14916a"/></marker>
    <marker id="black" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker>
    <marker id="gray" viewBox="0 0 9 9" markerWidth="3" markerHeight="3" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker>
    <style>
      .title{font:700 28px "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;fill:#172033}.label{font:600 18px "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;fill:#172033}.small{font:500 15px "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;fill:#475569}.math{font:italic 22px Georgia,"Times New Roman",serif;fill:#172033}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#fff"/>
  <text x="600" y="48" text-anchor="middle" class="title">2次元スライスの完全な自由物体図</text>
  <path d="M88 585 C262 502 390 470 530 438 C706 398 875 342 1114 236" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="1000" y="218" class="small">すべり面</text>

  <path d="M352 198 C447 156 610 137 764 176 L758 401 L382 486 L352 198Z" fill="#f4e7c5" stroke="#8b7355" stroke-width="3"/>
  <line x1="352" y1="198" x2="382" y2="486" stroke="#586174" stroke-width="4"/>
  <line x1="764" y1="176" x2="758" y2="401" stroke="#586174" stroke-width="4"/>
  <line x1="382" y1="486" x2="758" y2="401" stroke="#586174" stroke-width="6"/>
  <text x="560" y="276" text-anchor="middle" class="label">第 i スライス</text>

  <line x1="570" y1="246" x2="570" y2="385" stroke="#172033" stroke-width="6" marker-end="url(#black)"/>
  <text x="587" y="320" class="math">W<tspan baseline-shift="sub" font-size="15">i</tspan></text>

  <circle cx="570" cy="443" r="6" fill="#172033"/>
  <line x1="570" y1="443" x2="512" y2="316" stroke="#2563eb" stroke-width="7" marker-end="url(#blue)"/>
  <text x="458" y="300" class="math" fill="#2563eb">−N<tspan baseline-shift="sub" font-size="15">i</tspan> n<tspan baseline-shift="sub" font-size="15">i</tspan></text>
  <line x1="570" y1="443" x2="704" y2="413" stroke="#d64545" stroke-width="7" marker-end="url(#red)"/>
  <text x="686" y="385" class="math" fill="#d64545">−T<tspan baseline-shift="sub" font-size="15">i</tspan> m<tspan baseline-shift="sub" font-size="15">i</tspan></text>

  <line x1="570" y1="443" x2="622" y2="560" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#blue)"/>
  <text x="631" y="578" class="math" fill="#2563eb">n<tspan baseline-shift="sub" font-size="15">i</tspan></text>
  <text x="648" y="606" class="small" fill="#2563eb">外向き法線</text>
  <line x1="570" y1="443" x2="446" y2="471" stroke="#d64545" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#red)"/>
  <text x="414" y="486" class="math" fill="#d64545">m<tspan baseline-shift="sub" font-size="15">i</tspan></text>
  <text x="386" y="514" class="small" fill="#d64545">想定すべり方向</text>

  <line x1="354" y1="330" x2="460" y2="320" stroke="#14916a" stroke-width="6" marker-end="url(#green)"/>
  <text x="361" y="304" class="math" fill="#14916a">E<tspan baseline-shift="sub" font-size="15">i−1</tspan></text>
  <line x1="758" y1="294" x2="650" y2="300" stroke="#14916a" stroke-width="6" marker-end="url(#green)"/>
  <text x="775" y="292" class="math" fill="#14916a">E<tspan baseline-shift="sub" font-size="15">i</tspan></text>
  <line x1="369" y1="390" x2="363" y2="292" stroke="#14916a" stroke-width="6" marker-end="url(#green)"/>
  <text x="301" y="350" class="math" fill="#14916a">X<tspan baseline-shift="sub" font-size="15">i−1</tspan></text>
  <line x1="760" y1="248" x2="758" y2="346" stroke="#14916a" stroke-width="6" marker-end="url(#green)"/>
  <text x="784" y="340" class="math" fill="#14916a">X<tspan baseline-shift="sub" font-size="15">i</tspan></text>

  <line x1="382" y1="486" x2="520" y2="486" stroke="#64748b" stroke-width="2"/>
  <path d="M458 486 A76 76 0 0 0 456 469" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#gray)"/>
  <text x="470" y="474" class="math">α<tspan baseline-shift="sub" font-size="15">i</tspan></text>

  <rect x="84" y="636" width="1032" height="72" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <line x1="120" y1="671" x2="172" y2="671" stroke="#172033" stroke-width="5" marker-end="url(#black)"/><text x="184" y="678" class="small">外力</text>
  <line x1="285" y1="671" x2="337" y2="671" stroke="#2563eb" stroke-width="5" marker-end="url(#blue)"/><text x="349" y="678" class="small">底面法線力</text>
  <line x1="505" y1="671" x2="557" y2="671" stroke="#d64545" stroke-width="5" marker-end="url(#red)"/><text x="569" y="678" class="small">底面抵抗せん断力</text>
  <line x1="780" y1="671" x2="832" y2="671" stroke="#14916a" stroke-width="5" marker-end="url(#green)"/><text x="844" y="678" class="small">スライス間力</text>
</svg>
