<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title desc">
  <title id="title">無限斜面の柱にはたらく力と，すべり面の間隙水圧</title>
  <desc id="desc">左は，無限斜面から取り出した柱にはたらく力．自重 W を，すべり面の垂直力 N とせん断力 T が支え，両側の面にはたらく力は打ち消し合う．右は，地下水位がすべり面から鉛直に h_w の高さにあるときの，すべり面の点 P の間隙水圧の2つの算定方法．斜面に平行に浸透するときは，等ポテンシャル線が斜面に直交するので，P の圧力水頭は h_w cos²β になる．</desc>
