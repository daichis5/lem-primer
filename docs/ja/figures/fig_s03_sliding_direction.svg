  <text x="271" y="228.3" class="m" font-size="17" fill="#64748b" text-anchor="start"><tspan font-style="italic" font-weight="bold">d</tspan></text>
  <line x1="170" y1="172" x2="240" y2="172" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="3 3" stroke-linecap="round"/>
