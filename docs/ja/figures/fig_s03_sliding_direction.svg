<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title desc">
  <title id="title">全体すべり方向と，カラムの底面での局所すべり方向</title>
  <desc id="desc">左は平面図で，すべり面の長軸と全体すべり方向 d が一致するとは限らないことを示す．右は1つのカラムの底面の接平面で，d を接平面に射影したベクトル p を計算して描く．局所すべり方向 m は p の向きの単位ベクトルで，底面のせん断力 T はその逆向きに働く．</desc>
