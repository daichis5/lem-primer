<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790" role="img" aria-labelledby="title desc">
  <title id="title">3D LEMにおける全体すべり方向と局所底面せん断方向</title>
  <desc id="desc">平面上のすべり面主軸と全体すべり方向を区別し，全体方向をカラム底面の接平面へ投影して局所すべり方向を求め，抵抗せん断力をその反対向きに定める．</desc>
  <defs>
    <marker id="red" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d64545"/></marker>
    <marker id="blue" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="purple" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker>
    <marker id="gray" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      .title{font:700 28px "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;fill:#172033}.head{font:700 21px "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;fill:#172033}.label{font:600 17px "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;fill:#172033}.small{font:500 15px "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;fill:#475569}.math{font:italic 22px Georgia,"Times New Roman",serif;fill:#172033}.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}
    </style>
  </defs>
  <rect width="1400" height="790" fill="#fff"/>
  <text x="700" y="48" text-anchor="middle" class="title">全体すべり方向の仮定は，底面せん断力ベクトルの方向を決める</text>

  <rect x="45" y="88" width="520" height="610" rx="18" class="panel"/>
  <text x="305" y="132" text-anchor="middle" class="head">1　平面上で全体方向を定める</text>
  <ellipse cx="305" cy="380" rx="190" ry="112" transform="rotate(-18 305 380)" fill="#f4e7c5" stroke="#8b7355" stroke-width="3"/>
  <ellipse cx="305" cy="380" rx="148" ry="80" transform="rotate(-18 305 380)" fill="none" stroke="#586174" stroke-width="3" stroke-dasharray="9 7"/>
  <line x1="155" y1="430" x2="453" y2="331" stroke="#7c3aed" stroke-width="4" marker-end="url(#purple)"/>
  <text x="420" y="312" class="label" fill="#7c3aed">すべり面の主軸</text>
  <line x1="305" y1="380" x2="490" y2="425" stroke="#d64545" stroke-width="7" marker-end="url(#red)"/>
  <text x="466" y="462" class="math" fill="#d64545">d</text>
  <text x="305" y="555" text-anchor="middle" class="small">主軸方向と全体すべり方向 d は，</text>
  <text x="305" y="581" text-anchor="middle" class="small">関連しても同一とは限らない</text>
  <g transform="translate(122 168)"><line x1="0" y1="55" x2="74" y2="55" stroke="#172033" stroke-width="3" marker-end="url(#gray)"/><text x="83" y="61" class="math">x</text><line x1="0" y1="55" x2="0" y2="0" stroke="#172033" stroke-width="3" marker-end="url(#gray)"/><text x="10" y="9" class="math">y</text></g>

  <line x1="590" y1="390" x2="678" y2="390" stroke="#64748b" stroke-width="5" marker-end="url(#gray)"/>
  <text x="634" y="360" text-anchor="middle" class="small">底面へ投影</text>

  <rect x="702" y="88" width="653" height="610" rx="18" class="panel"/>
  <text x="1028" y="132" text-anchor="middle" class="head">2　各カラム底面で局所方向を作る</text>
  <polygon points="820,475 1065,357 1240,447 995,570" fill="#dbeafe" fill-opacity="0.72" stroke="#586174" stroke-width="4"/>
  <circle cx="1025" cy="456" r="7" fill="#172033"/>
  <line x1="1025" y1="456" x2="1102" y2="257" stroke="#2563eb" stroke-width="6" marker-end="url(#blue)"/>
  <text x="1110" y="250" class="math" fill="#2563eb">n<tspan baseline-shift="sub" font-size="14">i</tspan></text>
  <line x1="1025" y1="456" x2="1202" y2="430" stroke="#d64545" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#red)"/>
  <text x="1194" y="408" class="math" fill="#d64545">d</text>
  <line x1="1025" y1="456" x2="1168" y2="493" stroke="#d64545" stroke-width="8" marker-end="url(#red)"/>
  <text x="1168" y="526" class="math" fill="#d64545">m<tspan baseline-shift="sub" font-size="14">i</tspan></text>
  <line x1="1025" y1="456" x2="885" y2="420" stroke="#7c3aed" stroke-width="8" marker-end="url(#purple)"/>
  <text x="770" y="408" class="math" fill="#7c3aed">T<tspan baseline-shift="sub" font-size="14">i</tspan> = −‖T<tspan baseline-shift="sub" font-size="14">i</tspan>‖m<tspan baseline-shift="sub" font-size="14">i</tspan></text>
  <path d="M1202 430 Q1190 468 1168 493" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="1227" y="477" class="small">接平面への投影</text>

  <rect x="773" y="568" width="510" height="88" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <text x="1028" y="602" text-anchor="middle" class="math">p<tspan baseline-shift="sub" font-size="14">i</tspan> = (I − n<tspan baseline-shift="sub" font-size="14">i</tspan>n<tspan baseline-shift="sub" font-size="14">i</tspan><tspan baseline-shift="super" font-size="14">T</tspan>)d</text>
  <text x="1028" y="636" text-anchor="middle" class="math">m<tspan baseline-shift="sub" font-size="14">i</tspan> = p<tspan baseline-shift="sub" font-size="14">i</tspan> / ‖p<tspan baseline-shift="sub" font-size="14">i</tspan>‖</text>

  <rect x="190" y="722" width="1020" height="44" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="700" y="750" text-anchor="middle" class="label">m<tspan baseline-shift="sub" font-size="12">i</tspan> を変えると，T<tspan baseline-shift="sub" font-size="12">i</tspan> の各成分，N<tspan baseline-shift="sub" font-size="12">i</tspan>，カラム間力，モーメント，安全率も変わる</text>
</svg>
