  <text x="130" y="79" class="m" font-size="16" fill="#2563eb" text-anchor="start"><tspan font-style="italic">σ</tspan><tspan dy="4.5" font-size="11.2" font-style="italic">zz</tspan></text>
  <text x="182" y="145" class="m" font-size="16" fill="#14916a" text-anchor="start"><tspan font-style="italic">τ</tspan><tspan dy="4.5" font-size="11.2" font-style="italic">xz</tspan></text>
