  <text x="597.9" y="143.7" class="m" font-size="16" fill="#172033" text-anchor="end"><tspan font-style="italic" font-weight="bold">t</tspan><tspan font-style="normal">(</tspan><tspan font-style="italic" font-weight="bold">n</tspan><tspan dy="4.5" font-size="11.2" font-style="normal">2</tspan><tspan dy="-4.5" font-style="normal">)</tspan></text>
