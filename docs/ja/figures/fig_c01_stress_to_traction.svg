  <polygon points="70,175 56.8,181.2 56.8,168.8" fill="#2563eb" stroke-linejoin="round"/>
  <line x1="65" y1="207" x2="65" y2="189.5" stroke="#14916a" stroke-width="2" stroke-linecap="butt"/>
  <polygon points="65,186 69.2,194.8 60.8,194.8" fill="#14916a" stroke-linejoin="round"/>
