<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
  <title id="title">Mohr–Coulomb則によるせん断強度と，動員せん断応力</title>
  <desc id="desc">有効垂直応力とせん断応力の図に，c′=10 kPa，ϕ′=30° のMohr–Coulomb則の直線を引く．6節の数値例の2つの状態について，発揮できるせん断強度 τf と，動員せん断応力 τm=30 kPa を示す．水位が上がって有効垂直応力が60 kPaから40 kPaに下がると，τf は44.6 kPaから33.1 kPaに下がり，安全率は1.49から1.10に下がる．</desc>
  <style>.t{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif}.m{font-family:'STIX Two Text','Cambria','Times New Roman',serif}</style>
  <rect width="760" height="390" fill="#fff"/>
  <line x1="92" y1="330" x2="659" y2="330" stroke="#172033" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="92" y1="330" x2="92" y2="33" stroke="#172033" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="653.6" y1="330" x2="672.1" y2="330" stroke="#172033" stroke-width="1.4" stroke-linecap="butt"/>
  <polygon points="675.2,330 667.4,333.8 667.4,326.2" fill="#172033" stroke-linejoin="round"/>
  <line x1="92" y1="38.4" x2="92" y2="19.9" stroke="#172033" stroke-width="1.4" stroke-linecap="butt"/>
  <polygon points="92,16.8 95.8,24.6 88.2,24.6" fill="#172033" stroke-linejoin="round"/>
  <line x1="200" y1="330" x2="200" y2="335" stroke="#172033" stroke-width="1.2" stroke-linecap="round"/>
  <text x="200" y="351" class="t" font-size="13" fill="#475569" text-anchor="middle">20</text>
  <line x1="308" y1="330" x2="308" y2="335" stroke="#172033" stroke-width="1.2" stroke-linecap="round"/>
  <text x="308" y="351" class="t" font-size="13" fill="#475569" text-anchor="middle">40</text>
  <line x1="416" y1="330" x2="416" y2="335" stroke="#172033" stroke-width="1.2" stroke-linecap="round"/>
  <text x="416" y="351" class="t" font-size="13" fill="#475569" text-anchor="middle">60</text>
  <line x1="524" y1="330" x2="524" y2="335" stroke="#172033" stroke-width="1.2" stroke-linecap="round"/>
  <text x="524" y="351" class="t" font-size="13" fill="#475569" text-anchor="middle">80</text>
  <line x1="632" y1="330" x2="632" y2="335" stroke="#172033" stroke-width="1.2" stroke-linecap="round"/>
  <text x="632" y="351" class="t" font-size="13" fill="#475569" text-anchor="middle">100</text>
  <line x1="92" y1="276" x2="87" y2="276" stroke="#172033" stroke-width="1.2" stroke-linecap="round"/>
  <text x="83" y="281" class="t" font-size="13" fill="#475569" text-anchor="end">10</text>
  <line x1="92" y1="222" x2="87" y2="222" stroke="#172033" stroke-width="1.2" stroke-linecap="round"/>
  <text x="83" y="227" class="t" font-size="13" fill="#475569" text-anchor="end">20</text>
  <line x1="92" y1="168" x2="87" y2="168" stroke="#172033" stroke-width="1.2" stroke-linecap="round"/>
  <text x="83" y="173" class="t" font-size="13" fill="#475569" text-anchor="end">30</text>
  <line x1="92" y1="114" x2="87" y2="114" stroke="#172033" stroke-width="1.2" stroke-linecap="round"/>
  <text x="83" y="119" class="t" font-size="13" fill="#475569" text-anchor="end">40</text>
  <line x1="92" y1="60" x2="87" y2="60" stroke="#172033" stroke-width="1.2" stroke-linecap="round"/>
  <text x="83" y="65" class="t" font-size="13" fill="#475569" text-anchor="end">50</text>
  <text x="680.6" y="336" class="m" font-size="17" fill="#172033" text-anchor="start"><tspan font-style="italic">σ</tspan><tspan font-style="normal">′</tspan><tspan dy="4.8" font-size="11.9" font-style="italic">n</tspan></text>
  <text x="682.6" y="356" class="t" font-size="13" fill="#475569" text-anchor="start">[kPa]</text>
  <text x="102" y="22.8" class="m" font-size="17" fill="#172033" text-anchor="start"><tspan font-style="italic">τ</tspan></text>
  <text x="116" y="22.8" class="t" font-size="13" fill="#475569" text-anchor="start">[kPa]</text>
  <line x1="92" y1="276" x2="494.2" y2="43.8" stroke="#172033" stroke-width="2.6" stroke-linecap="round"/>
  <text x="504.2" y="49.8" class="m" font-size="16" fill="#172033" text-anchor="start"><tspan font-style="italic">τ</tspan><tspan dy="4.5" font-size="11.2" font-style="italic">f</tspan><tspan dy="-4.5" font-style="normal"> = </tspan><tspan font-style="italic">c</tspan><tspan font-style="normal">′ + </tspan><tspan font-style="italic">σ</tspan><tspan font-style="normal">′</tspan><tspan dy="4.5" font-size="11.2" font-style="italic">n</tspan><tspan dy="-4.5" font-style="normal"> tan </tspan><tspan font-style="italic">ϕ</tspan><tspan font-style="normal">′</tspan></text>
  <line x1="92" y1="168" x2="637.4" y2="168" stroke="#14916a" stroke-width="1.8" stroke-dasharray="7 5" stroke-linecap="round"/>
  <text x="637.4" y="160" class="m" font-size="16" fill="#14916a" text-anchor="end"><tspan font-style="italic">τ</tspan><tspan dy="4.5" font-size="11.2" font-style="italic">m</tspan><tspan dy="-4.5" font-style="normal"> = 30</tspan></text>
  <text x="100" y="294" class="m" font-size="15" fill="#475569" text-anchor="start"><tspan font-style="italic">c</tspan><tspan font-style="normal">′ = 10</tspan></text>
  <line x1="135.2" y1="251.1" x2="205.2" y2="251.1" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="4 3" stroke-linecap="round"/>
  <path d="M193.2 251.1 A58 58 0 0 0 185.4 222.1" fill="none" stroke="#475569" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="199.2" y="243.1" class="m" font-size="15" fill="#475569" text-anchor="start"><tspan font-style="italic">ϕ</tspan><tspan font-style="normal">′ = 30°</tspan></text>
  <line x1="416" y1="330" x2="416" y2="88.9" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="3 3" stroke-linecap="round"/>
  <circle cx="416" cy="88.9" r="4.6" fill="#172033"/>
  <circle cx="416" cy="168" r="4.6" fill="#14916a"/>
  <circle cx="416" cy="330" r="4" fill="#2563eb"/>
  <text x="428" y="110.9" class="m" font-size="15" fill="#172033" text-anchor="start"><tspan font-style="italic">τ</tspan><tspan dy="4.2" font-size="10.5" font-style="italic">f</tspan><tspan dy="-4.2" font-style="normal"> = 44.6</tspan></text>
  <text x="428" y="131.9" class="m" font-size="15" fill="#172033" text-anchor="start"><tspan font-style="italic">F</tspan><tspan dy="4.2" font-size="10.5" font-style="italic">s</tspan><tspan dy="-4.2" font-style="normal"> = 44.6 / 30 = 1.49</tspan></text>
  <line x1="308" y1="330" x2="308" y2="151.3" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="3 3" stroke-linecap="round"/>
  <circle cx="308" cy="151.3" r="4.6" fill="#172033"/>
  <circle cx="308" cy="168" r="4.6" fill="#14916a"/>
  <circle cx="308" cy="330" r="4" fill="#2563eb"/>
  <text x="294" y="119.3" class="m" font-size="15" fill="#172033" text-anchor="end"><tspan font-style="italic">τ</tspan><tspan dy="4.2" font-size="10.5" font-style="italic">f</tspan><tspan dy="-4.2" font-style="normal"> = 33.1</tspan></text>
  <text x="294" y="140.3" class="m" font-size="15" fill="#172033" text-anchor="end"><tspan font-style="italic">F</tspan><tspan dy="4.2" font-size="10.5" font-style="italic">s</tspan><tspan dy="-4.2" font-style="normal"> = 33.1 / 30 = 1.10</tspan></text>
  <line x1="405.2" y1="305.7" x2="324.1" y2="305.7" stroke="#0891b2" stroke-width="2.4" stroke-linecap="butt"/>
  <polygon points="318.8,305.7 332,299.5 332,311.9" fill="#0891b2" stroke-linejoin="round"/>
  <text x="424" y="310.7" class="m" font-size="15" fill="#0891b2" text-anchor="start"><tspan font-style="italic">u</tspan><tspan font-style="normal" class="t" font-size="14"> が上がる</tspan></text>
</svg>
