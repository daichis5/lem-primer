<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Mohr–Coulomb強度と動員せん断応力</title>
  <desc id="desc">有効法線応力に対する発揮可能なせん断強度と，安全率によって低減された動員せん断応力を二本の直線と同一法線応力上の値で比較する．</desc>
  <defs>
    <marker id="gray" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <marker id="blue" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="red" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d64545"/></marker>
    <style>
      .title{font:700 28px "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;fill:#172033}.head{font:700 21px "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;fill:#172033}.label{font:600 17px "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;fill:#172033}.small{font:500 15px "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;fill:#475569}.math{font:italic 22px Georgia,"Times New Roman",serif;fill:#172033}.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}
    </style>
  </defs>
  <rect width="1400" height="760" fill="#fff"/>
  <text x="700" y="48" text-anchor="middle" class="title">発揮可能な強度と，つり合いに必要な動員量を区別する</text>

  <rect x="45" y="86" width="870" height="610" rx="18" class="panel"/>
  <text x="480" y="126" text-anchor="middle" class="head">Mohr–Coulomb強度と安全率による動員</text>
  <line x1="150" y1="600" x2="835" y2="600" stroke="#64748b" stroke-width="4" marker-end="url(#gray)"/>
  <line x1="150" y1="600" x2="150" y2="168" stroke="#64748b" stroke-width="4" marker-end="url(#gray)"/>
  <text x="850" y="610" class="math">σ′<tspan baseline-shift="sub" font-size="14">n</tspan></text>
  <text x="124" y="167" class="math">τ</text>
  <line x1="150" y1="520" x2="815" y2="190" stroke="#2563eb" stroke-width="6"/>
  <text x="545" y="285" class="math" fill="#2563eb">τ<tspan baseline-shift="sub" font-size="14">f</tspan> = c′ + σ′<tspan baseline-shift="sub" font-size="14">n</tspan> tanφ′</text>
  <line x1="150" y1="565" x2="815" y2="360" stroke="#d64545" stroke-width="6"/>
  <text x="555" y="430" class="math" fill="#d64545">τ<tspan baseline-shift="sub" font-size="14">m</tspan> = τ<tspan baseline-shift="sub" font-size="14">f</tspan> / F<tspan baseline-shift="sub" font-size="14">s</tspan></text>
  <text x="120" y="526" text-anchor="end" class="math" fill="#2563eb">c′</text>
  <text x="120" y="570" text-anchor="end" class="math" fill="#d64545">c′/F<tspan baseline-shift="sub" font-size="14">s</tspan></text>
  <line x1="610" y1="600" x2="610" y2="292" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 7"/>
  <circle cx="610" cy="292" r="7" fill="#2563eb"/>
  <circle cx="610" cy="423" r="7" fill="#d64545"/>
  <line x1="638" y1="300" x2="638" y2="413" stroke="#64748b" stroke-width="3" marker-start="url(#gray)" marker-end="url(#gray)"/>
  <text x="657" y="365" class="math">F<tspan baseline-shift="sub" font-size="14">s</tspan> = τ<tspan baseline-shift="sub" font-size="14">f</tspan>/τ<tspan baseline-shift="sub" font-size="14">m</tspan></text>
  <text x="610" y="630" text-anchor="middle" class="math">現在の σ′<tspan baseline-shift="sub" font-size="14">n</tspan></text>
  <text x="480" y="673" text-anchor="middle" class="small">青線は破壊時の上限，赤線は共通安全率の下でつり合いに動員する量</text>

  <rect x="945" y="86" width="410" height="610" rx="18" class="panel"/>
  <text x="1150" y="126" text-anchor="middle" class="head">同じ有効法線応力で比較</text>
  <rect x="1010" y="205" width="70" height="310" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="1115" y="337" width="70" height="178" rx="8" fill="#fee2e2" stroke="#d64545" stroke-width="2"/>
  <line x1="990" y1="515" x2="1210" y2="515" stroke="#64748b" stroke-width="3"/>
  <text x="1045" y="190" text-anchor="middle" class="math" fill="#2563eb">τ<tspan baseline-shift="sub" font-size="14">f</tspan></text>
  <text x="1150" y="322" text-anchor="middle" class="math" fill="#d64545">τ<tspan baseline-shift="sub" font-size="14">m</tspan></text>
  <path d="M1240 208 V337" stroke="#64748b" stroke-width="3" marker-start="url(#gray)" marker-end="url(#gray)"/>
  <text x="1261" y="279" class="math">F<tspan baseline-shift="sub" font-size="14">s</tspan></text>
  <rect x="992" y="566" width="316" height="70" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="1150" y="595" text-anchor="middle" class="small">τ<tspan baseline-shift="sub" font-size="11">m</tspan>は事前に測る値ではなく，</text>
  <text x="1150" y="620" text-anchor="middle" class="small">つり合いと同時に決まる</text>
</svg>
