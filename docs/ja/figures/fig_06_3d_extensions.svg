<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" role="img" aria-labelledby="title desc">
  <title id="title">2D LEMから3D LEMへの代表的な拡張</title>
  <desc id="desc">二次元のFellenius，Bishop，Spencer，Morgenstern–Price型の閉じ方を，カラム，二方向の内部境界，全体すべり方向と回転軸を持つ三次元問題へ移植または一般化する流れ．</desc>
  <defs>
    <marker id="gray" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <marker id="green" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#14916a"/></marker>
    <style>
      .title{font:700 28px "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;fill:#172033}.head{font:700 21px "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;fill:#172033}.label{font:600 17px "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;fill:#172033}.small{font:500 14px "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;fill:#475569}.math{font:italic 19px Georgia,"Times New Roman",serif;fill:#172033}.box2d{fill:#eff6ff;stroke:#93c5fd;stroke-width:2}.box3d{fill:#f0fdf4;stroke:#86efac;stroke-width:2}.assume{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}
    </style>
  </defs>
  <rect width="1500" height="860" fill="#fff"/>
  <text x="750" y="48" text-anchor="middle" class="title">3D化とは，2Dの閉じ方を二方向のカラム系へ再定義すること</text>

  <rect x="55" y="88" width="345" height="72" rx="14" class="box2d"/><text x="227" y="120" text-anchor="middle" class="head">2D：スライス法</text><text x="227" y="145" text-anchor="middle" class="small">一方向の内部境界</text>
  <rect x="570" y="88" width="360" height="72" rx="14" class="assume"/><text x="750" y="120" text-anchor="middle" class="head">移植する力学的な仮定</text><text x="750" y="145" text-anchor="middle" class="small">無視・簡略化・方向関係</text>
  <rect x="1100" y="88" width="345" height="72" rx="14" class="box3d"/><text x="1272" y="120" text-anchor="middle" class="head">3D：カラム法</text><text x="1272" y="145" text-anchor="middle" class="small">二方向の内部境界</text>

  <g transform="translate(55 190)">
    <rect width="345" height="130" rx="14" class="box2d"/><text x="172" y="38" text-anchor="middle" class="head">Fellenius型</text><text x="172" y="72" text-anchor="middle" class="label">スライス間力を省略</text><text x="172" y="102" text-anchor="middle" class="small">円弧モーメントを集計</text>
    <line x1="365" y1="65" x2="500" y2="65" stroke="#64748b" stroke-width="4" marker-end="url(#gray)"/>
    <rect x="515" width="360" height="130" rx="14" class="assume"/><text x="695" y="38" text-anchor="middle" class="label">スライス → カラム</text><text x="695" y="70" text-anchor="middle" class="label">内部力の省略を維持</text><text x="695" y="101" text-anchor="middle" class="small">局所底面積と仮定した全体すべり方向を使用</text>
    <line x1="895" y1="65" x2="1030" y2="65" stroke="#14916a" stroke-width="4" marker-end="url(#green)"/>
    <rect x="1045" width="345" height="130" rx="14" class="box3d"/><text x="1217" y="38" text-anchor="middle" class="head">Hovland型3D</text><text x="1217" y="72" text-anchor="middle" class="label">カラム間力を省略</text><text x="1217" y="102" text-anchor="middle" class="small">有限幅・端部形状を反映</text>
  </g>

  <g transform="translate(55 340)">
    <rect width="345" height="130" rx="14" class="box2d"/><text x="172" y="38" text-anchor="middle" class="head">Bishop簡便型</text><text x="172" y="72" text-anchor="middle" class="label">Xを簡略化</text><text x="172" y="102" text-anchor="middle" class="small">鉛直力＋全体モーメント</text>
    <line x1="365" y1="65" x2="500" y2="65" stroke="#64748b" stroke-width="4" marker-end="url(#gray)"/>
    <rect x="515" width="360" height="130" rx="14" class="assume"/><text x="695" y="38" text-anchor="middle" class="label">鉛直方向の簡略化を移植</text><text x="695" y="70" text-anchor="middle" class="label">中心 → 回転軸</text><text x="695" y="101" text-anchor="middle" class="small">水平二方向の力つり合いは残る</text>
    <line x1="895" y1="65" x2="1030" y2="65" stroke="#14916a" stroke-width="4" marker-end="url(#green)"/>
    <rect x="1045" width="345" height="130" rx="14" class="box3d"/><text x="1217" y="38" text-anchor="middle" class="head">Hungr／Ugai 3D Bishop</text><text x="1217" y="72" text-anchor="middle" class="label">カラム鉛直力＋軸モーメント</text><text x="1217" y="102" text-anchor="middle" class="small">回転的な機構と相性がよい</text>
  </g>

  <g transform="translate(55 490)">
    <rect width="345" height="130" rx="14" class="box2d"/><text x="172" y="38" text-anchor="middle" class="head">Spencer型</text><text x="172" y="72" text-anchor="middle" class="label">内力方向を平行と仮定</text><text x="172" y="102" text-anchor="middle" class="small">力＋モーメント</text>
    <line x1="365" y1="65" x2="500" y2="65" stroke="#64748b" stroke-width="4" marker-end="url(#gray)"/>
    <rect x="515" width="360" height="130" rx="14" class="assume"/><text x="695" y="38" text-anchor="middle" class="label">平行性を空間内で定義</text><text x="695" y="70" text-anchor="middle" class="label">二組の境界力を関係付ける</text><text x="695" y="101" text-anchor="middle" class="small">主すべり方向・底面せん断方向を追加</text>
    <line x1="895" y1="65" x2="1030" y2="65" stroke="#14916a" stroke-width="4" marker-end="url(#green)"/>
    <rect x="1045" width="345" height="130" rx="14" class="box3d"/><text x="1217" y="38" text-anchor="middle" class="head">Extended 3D Spencer</text><text x="1217" y="72" text-anchor="middle" class="label">空間的な内力方向仮定</text><text x="1217" y="102" text-anchor="middle" class="small">力＋採用モーメント条件</text>
  </g>

  <g transform="translate(55 640)">
    <rect width="345" height="130" rx="14" class="box2d"/><text x="172" y="38" text-anchor="middle" class="head">Morgenstern–Price／GLE</text><text x="172" y="72" text-anchor="middle" class="math">X/E = λf(x)</text><text x="172" y="102" text-anchor="middle" class="small">位置で変わる内力方向</text>
    <line x1="365" y1="65" x2="500" y2="65" stroke="#64748b" stroke-width="4" marker-end="url(#gray)"/>
    <rect x="515" width="360" height="130" rx="14" class="assume"/><text x="695" y="38" text-anchor="middle" class="label">内力関数を二方向へ一般化</text><text x="695" y="70" text-anchor="middle" class="math">λ<tspan baseline-shift="sub" font-size="13">x</tspan>f<tspan baseline-shift="sub" font-size="13">x</tspan>(x,y), λ<tspan baseline-shift="sub" font-size="13">y</tspan>f<tspan baseline-shift="sub" font-size="13">y</tspan>(x,y)</text><text x="695" y="101" text-anchor="middle" class="small">非対称形状では全体すべり方位も明示</text>
    <line x1="895" y1="65" x2="1030" y2="65" stroke="#14916a" stroke-width="4" marker-end="url(#green)"/>
    <rect x="1045" width="345" height="130" rx="14" class="box3d"/><text x="1217" y="38" text-anchor="middle" class="head">Lam–Fredlund／Cheng–Yip</text><text x="1217" y="72" text-anchor="middle" class="label">二方向の内力関数</text><text x="1217" y="102" text-anchor="middle" class="small">一般性と未知量がともに増える</text>
  </g>
  <text x="750" y="825" text-anchor="middle" class="small">3D化しても，元の2D法が省略したつり合いや内部力が自動的に回復するわけではない</text>
</svg>
