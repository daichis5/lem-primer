<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700" role="img" aria-labelledby="title desc">
  <title id="title">形状入力から物理的妥当性までの四段階</title>
  <desc id="desc">すべり面を入力できること，安全率の数値解が得られること，必要な静力学的つり合いを満たすこと，変形機構として物理的に妥当であることを別々の判定段階として示す．</desc>
  <defs>
    <marker id="gray" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <marker id="blue" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="green" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#14916a"/></marker>
    <style>
      .title{font:700 28px "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;fill:#172033}.head{font:700 19px "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;fill:#172033}.label{font:600 16px "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;fill:#172033}.small{font:500 14px "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;fill:#475569}.math{font:italic 21px Georgia,"Times New Roman",serif;fill:#172033}.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}
    </style>
  </defs>
  <rect width="1500" height="700" fill="#fff"/>
  <text x="750" y="48" text-anchor="middle" class="title">「入力できる」「計算できる」「つり合う」「妥当である」は同義ではない</text>

  <g transform="translate(35 100)">
    <rect width="320" height="480" rx="18" class="panel"/>
    <circle cx="35" cy="35" r="21" fill="#64748b"/><text x="35" y="42" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#fff">1</text>
    <text x="160" y="42" text-anchor="middle" class="head">幾何学的入力可能性</text>
    <path d="M45 280 C110 165 210 185 278 245 L278 365 C205 318 116 325 48 405Z" fill="#f4e7c5" stroke="#8b7355" stroke-width="2"/>
    <path d="M48 405 C116 325 205 318 278 365" fill="none" stroke="#586174" stroke-width="5"/>
    <line x1="105" y1="223" x2="108" y2="337" stroke="#8b7355" stroke-width="2"/><line x1="165" y1="190" x2="168" y2="320" stroke="#8b7355" stroke-width="2"/><line x1="225" y1="206" x2="228" y2="332" stroke="#8b7355" stroke-width="2"/>
    <text x="160" y="115" text-anchor="middle" class="label">面を分割できるか</text>
    <text x="160" y="145" text-anchor="middle" class="small">円弧・楕円・複合面・自由曲面</text>
    <text x="160" y="440" text-anchor="middle" class="small">局所法線・接線・面積を定義</text>
  </g>
  <g transform="translate(390 100)">
    <rect width="320" height="480" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="35" cy="35" r="21" fill="#2563eb"/><text x="35" y="42" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#fff">2</text>
    <text x="160" y="42" text-anchor="middle" class="head">数学的計算可能性</text>
    <text x="160" y="115" text-anchor="middle" class="label">反復計算が収束するか</text>
    <circle cx="160" cy="280" r="88" fill="#fff" stroke="#2563eb" stroke-width="3"/>
    <path d="M111 236 A66 66 0 0 1 210 245" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#blue)"/>
    <path d="M210 316 A66 66 0 0 1 111 323" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#blue)"/>
    <text x="160" y="278" text-anchor="middle" class="math">F<tspan baseline-shift="sub" font-size="14">s</tspan></text>
    <text x="160" y="309" text-anchor="middle" class="small">残差 → 0</text>
    <text x="160" y="425" text-anchor="middle" class="small">数値が返ることを確認</text>
    <text x="160" y="450" text-anchor="middle" class="small">ただし物理性はまだ未確認</text>
  </g>
  <g transform="translate(745 100)">
    <rect width="320" height="480" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
    <circle cx="35" cy="35" r="21" fill="#7c3aed"/><text x="35" y="42" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#fff">3</text>
    <text x="160" y="42" text-anchor="middle" class="head">静力学的完全性</text>
    <text x="160" y="115" text-anchor="middle" class="label">必要なつり合いを満足するか</text>
    <line x1="72" y1="275" x2="248" y2="275" stroke="#586174" stroke-width="6"/>
    <polygon points="160,275 123,350 197,350" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <rect x="76" y="220" width="52" height="54" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><rect x="202" y="220" width="52" height="54" fill="#fee2e2" stroke="#d64545" stroke-width="2"/>
    <line x1="102" y1="178" x2="102" y2="216" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/><line x1="228" y1="178" x2="228" y2="216" stroke="#d64545" stroke-width="4" marker-end="url(#gray)"/>
    <text x="160" y="405" text-anchor="middle" class="math">ΣF = 0,　ΣM = 0</text>
    <text x="160" y="445" text-anchor="middle" class="small">どの方向・どの軸を要求するかも確認</text>
  </g>
  <g transform="translate(1100 100)">
    <rect width="365" height="480" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <circle cx="35" cy="35" r="21" fill="#14916a"/><text x="35" y="42" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#fff">4</text>
    <text x="183" y="42" text-anchor="middle" class="head">力学的・運動学的妥当性</text>
    <text x="183" y="115" text-anchor="middle" class="label">想定した機構が現実的か</text>
    <path d="M58 315 C125 213 250 207 316 275" fill="none" stroke="#586174" stroke-width="6"/>
    <path d="M86 290 C142 240 222 232 286 262" fill="none" stroke="#14916a" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="110" y1="280" x2="142" y2="264" stroke="#14916a" stroke-width="4" marker-end="url(#green)"/><line x1="192" y1="252" x2="229" y2="250" stroke="#14916a" stroke-width="4" marker-end="url(#green)"/>
    <circle cx="102" cy="345" r="8" fill="#2563eb"/><circle cx="183" cy="322" r="8" fill="#2563eb"/><circle cx="270" cy="329" r="8" fill="#2563eb"/>
    <text x="183" y="390" text-anchor="middle" class="small">正の法線力・現実的な内力線</text>
    <text x="183" y="420" text-anchor="middle" class="small">変形可能性・地質構造との整合</text>
    <text x="183" y="452" text-anchor="middle" class="label" fill="#14916a">結果の意味を説明できるか</text>
  </g>

  <g class="small" fill="#64748b" text-anchor="middle">
    <text x="372" y="326">≠</text><text x="372" y="350">自動保証しない</text>
    <text x="727" y="326">≠</text><text x="727" y="350">自動保証しない</text>
    <text x="1082" y="326">≠</text><text x="1082" y="350">自動保証しない</text>
  </g>
  <rect x="230" y="615" width="1040" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="750" y="646" text-anchor="middle" class="label">非円弧面でF<tspan baseline-shift="sub" font-size="12">s</tspan>が収束しても，原法と同じつり合い・変形機構が保証されたとは限らない</text>
</svg>
