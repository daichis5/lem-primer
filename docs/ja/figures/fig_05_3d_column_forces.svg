<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="800" viewBox="0 0 1300 800" role="img" aria-labelledby="title desc">
  <title id="title">一般的な3Dカラムに作用する力</title>
  <desc id="desc">傾斜した底面を持つ三次元カラムに，自重，底面法線力，抵抗せん断力，外向き法線，局所すべり方向，四側面のカラム間力が作用する．</desc>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="red" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d64545"/></marker>
    <marker id="green" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#14916a"/></marker>
    <marker id="black" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker>
    <style>
      .title{font:700 28px "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;fill:#172033}.label{font:600 18px "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;fill:#172033}.small{font:500 15px "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;fill:#475569}.math{font:italic 22px Georgia,"Times New Roman",serif;fill:#172033}
    </style>
  </defs>
  <rect width="1300" height="800" fill="#fff"/>
  <text x="650" y="48" text-anchor="middle" class="title">3次元カラムでは，底面接平面内に方向の自由度が増える</text>

  <polygon points="410,190 695,145 890,258 600,310" fill="#fef3c7" stroke="#8b7355" stroke-width="3"/>
  <polygon points="410,190 600,310 600,570 420,455" fill="#f4e7c5" fill-opacity="0.9" stroke="#8b7355" stroke-width="3"/>
  <polygon points="600,310 890,258 870,500 600,570" fill="#ead7ad" fill-opacity="0.9" stroke="#8b7355" stroke-width="3"/>
  <polygon points="410,190 695,145 690,404 420,455" fill="#f8e9c6" fill-opacity="0.46" stroke="#8b7355" stroke-width="2" stroke-dasharray="7 6"/>
  <polygon points="420,455 690,404 870,500 600,570" fill="#dbeafe" fill-opacity="0.75" stroke="#586174" stroke-width="5"/>
  <text x="648" y="230" text-anchor="middle" class="label">第 i カラム</text>

  <line x1="650" y1="230" x2="650" y2="384" stroke="#172033" stroke-width="7" marker-end="url(#black)"/>
  <text x="667" y="318" class="math">W<tspan baseline-shift="sub" font-size="15">i</tspan></text>

  <circle cx="645" cy="477" r="7" fill="#172033"/>
  <line x1="645" y1="477" x2="592" y2="327" stroke="#2563eb" stroke-width="8" marker-end="url(#blue)"/>
  <text x="517" y="315" class="math" fill="#2563eb">−N<tspan baseline-shift="sub" font-size="15">i</tspan> n<tspan baseline-shift="sub" font-size="15">i</tspan></text>
  <line x1="645" y1="477" x2="807" y2="449" stroke="#d64545" stroke-width="8" marker-end="url(#red)"/>
  <text x="807" y="426" class="math" fill="#d64545">T<tspan baseline-shift="sub" font-size="15">i</tspan> = −T<tspan baseline-shift="sub" font-size="15">i</tspan>m<tspan baseline-shift="sub" font-size="15">i</tspan></text>
  <line x1="645" y1="477" x2="707" y2="638" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#blue)"/>
  <text x="716" y="659" class="math" fill="#2563eb">n<tspan baseline-shift="sub" font-size="15">i</tspan></text>
  <line x1="645" y1="477" x2="502" y2="501" stroke="#d64545" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#red)"/>
  <text x="468" y="515" class="math" fill="#d64545">m<tspan baseline-shift="sub" font-size="15">i</tspan></text>

  <line x1="420" y1="340" x2="525" y2="357" stroke="#14916a" stroke-width="7" marker-end="url(#green)"/>
  <text x="328" y="333" class="label" fill="#14916a">x面の内力</text>
  <line x1="875" y1="366" x2="768" y2="386" stroke="#14916a" stroke-width="7" marker-end="url(#green)"/>
  <text x="907" y="354" class="label" fill="#14916a">x面の内力</text>
  <line x1="540" y1="247" x2="603" y2="290" stroke="#14916a" stroke-width="7" marker-end="url(#green)"/>
  <text x="405" y="232" class="label" fill="#14916a">y面の内力</text>
  <line x1="735" y1="478" x2="680" y2="445" stroke="#14916a" stroke-width="7" marker-end="url(#green)"/>
  <text x="822" y="548" class="label" fill="#14916a">y面の内力</text>

  <g transform="translate(1010 574)">
    <line x1="0" y1="95" x2="94" y2="95" stroke="#172033" stroke-width="4" marker-end="url(#black)"/><text x="103" y="101" class="math">x</text>
    <line x1="0" y1="95" x2="-56" y2="40" stroke="#172033" stroke-width="4" marker-end="url(#black)"/><text x="-74" y="35" class="math">y</text>
    <line x1="0" y1="95" x2="0" y2="0" stroke="#172033" stroke-width="4" marker-end="url(#black)"/><text x="11" y="6" class="math">z</text>
  </g>

  <rect x="72" y="620" width="444" height="104" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="94" y="653" class="small">底面せん断力の大きさ：</text>
  <text x="278" y="653" class="math">‖T<tspan baseline-shift="sub" font-size="14">i</tspan>‖</text>
  <text x="94" y="688" class="small">接平面内の方向：</text>
  <text x="278" y="688" class="math">m<tspan baseline-shift="sub" font-size="14">i</tspan></text>
  <text x="324" y="688" class="small">を別に定める必要がある</text>
</svg>
