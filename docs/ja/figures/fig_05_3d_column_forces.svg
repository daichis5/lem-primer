<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title desc">
  <title id="title">3次元のカラムに働く力</title>
  <desc id="desc">傾いた底面をもつ3次元のカラムに，自重，底面の垂直力とせん断力，側面のカラム間力が働く．底面のせん断力は接平面の中のベクトルで，その向きは強度の式からは決まらない．点線の円は，接平面の中で向きがとりうる範囲を示す．</desc>
