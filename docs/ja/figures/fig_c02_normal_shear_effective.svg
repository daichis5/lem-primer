<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">tractionの分解と有効法線応力</title>
  <desc id="desc">面に作用するtractionを圧縮法線成分とせん断成分へ分解し，間隙水圧が有効法線応力を低下させる一方でせん断成分を直接変えないことを示す．</desc>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="cyan" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0891b2"/></marker>
    <marker id="red" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d64545"/></marker>
    <marker id="purple" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker>
    <marker id="gray" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      .title{font:700 28px "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;fill:#172033}.head{font:700 21px "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;fill:#172033}.label{font:600 17px "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;fill:#172033}.small{font:500 15px "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;fill:#475569}.math{font:italic 22px Georgia,"Times New Roman",serif;fill:#172033}.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}
    </style>
  </defs>
  <rect width="1400" height="760" fill="#fff"/>
  <text x="700" y="48" text-anchor="middle" class="title">全tractionを分解し，法線成分に間隙水圧を反映する</text>

  <rect x="45" y="86" width="570" height="590" rx="18" class="panel"/>
  <text x="330" y="128" text-anchor="middle" class="head">1　tractionの法線・せん断分解</text>
  <polygon points="145,455 410,300 535,370 268,529" fill="#f4e7c5" stroke="#8b7355" stroke-width="3"/>
  <circle cx="330" cy="414" r="6" fill="#172033"/>
  <line x1="330" y1="414" x2="480" y2="321" stroke="#7c3aed" stroke-width="7" marker-end="url(#purple)"/>
  <text x="488" y="309" class="math" fill="#7c3aed">t(n)</text>
  <line x1="330" y1="414" x2="262" y2="300" stroke="#2563eb" stroke-width="7" marker-end="url(#blue)"/>
  <text x="174" y="286" class="math" fill="#2563eb">−σ<tspan baseline-shift="sub" font-size="14">n</tspan> n</text>
  <line x1="330" y1="414" x2="459" y2="340" stroke="#d64545" stroke-width="7" marker-end="url(#red)"/>
  <text x="425" y="389" class="math" fill="#d64545">t<tspan baseline-shift="sub" font-size="14">∥</tspan></text>
  <line x1="330" y1="414" x2="390" y2="516" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#blue)"/>
  <text x="401" y="538" class="math" fill="#2563eb">n</text>
  <rect x="105" y="167" width="450" height="78" rx="11" fill="#fff" stroke="#cbd5e1"/>
  <text x="330" y="216" text-anchor="middle" class="math">t(n) = −σ<tspan baseline-shift="sub" font-size="14">n</tspan>n + t<tspan baseline-shift="sub" font-size="14">∥</tspan></text>
  <text x="330" y="616" text-anchor="middle" class="small">法線と接平面内の成分は，互いに直交する</text>

  <line x1="637" y1="378" x2="720" y2="378" stroke="#64748b" stroke-width="5" marker-end="url(#gray)"/>
  <text x="678" y="350" text-anchor="middle" class="small">有効応力へ</text>

  <rect x="742" y="86" width="613" height="590" rx="18" class="panel"/>
  <text x="1048" y="128" text-anchor="middle" class="head">2　間隙水圧は法線拘束を低下させる</text>
  <polygon points="820,490 1093,360 1264,430 990,566" fill="#f4e7c5" stroke="#8b7355" stroke-width="3"/>
  <circle cx="1030" cy="465" r="6" fill="#172033"/>
  <line x1="1030" y1="465" x2="963" y2="316" stroke="#2563eb" stroke-width="8" marker-end="url(#blue)"/>
  <text x="870" y="302" class="math" fill="#2563eb">−σ<tspan baseline-shift="sub" font-size="14">n</tspan> n</text>
  <line x1="1030" y1="465" x2="1065" y2="543" stroke="#0891b2" stroke-width="7" marker-end="url(#cyan)"/>
  <text x="1078" y="562" class="math" fill="#0891b2">+u n</text>
  <line x1="1030" y1="465" x2="986" y2="366" stroke="#2563eb" stroke-width="5" stroke-dasharray="8 6" marker-end="url(#blue)"/>
  <text x="852" y="370" class="math" fill="#2563eb">−σ′<tspan baseline-shift="sub" font-size="14">n</tspan> n</text>
  <line x1="1030" y1="465" x2="1180" y2="391" stroke="#d64545" stroke-width="7" marker-end="url(#red)"/>
  <text x="1188" y="386" class="math" fill="#d64545">t<tspan baseline-shift="sub" font-size="14">∥</tspan></text>
  <rect x="808" y="168" width="480" height="92" rx="11" fill="#fff" stroke="#cbd5e1"/>
  <text x="1048" y="205" text-anchor="middle" class="math">σ′<tspan baseline-shift="sub" font-size="14">n</tspan> = σ<tspan baseline-shift="sub" font-size="14">n</tspan> − u</text>
  <text x="1048" y="239" text-anchor="middle" class="small">間隙水圧は等方的に作用する</text>
  <rect x="836" y="592" width="424" height="52" rx="10" fill="#fff1f2" stroke="#fda4af"/>
  <text x="1048" y="625" text-anchor="middle" class="label" fill="#d64545">せん断成分 t<tspan baseline-shift="sub" font-size="12">∥</tspan> は直接は変化しない</text>
</svg>
