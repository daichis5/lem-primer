<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="790" viewBox="0 0 1500 790" role="img" aria-labelledby="title desc">
  <title id="title">Fellenius法，Bishop簡便法，Janbu簡便法の比較</title>
  <desc id="desc">三つの二次元簡便法について，スライス間力の扱いと，採用または残されるつり合い条件を同じ自由物体図で比較する．</desc>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="red" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d64545"/></marker>
    <marker id="green" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#14916a"/></marker>
    <marker id="black" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker>
    <style>
      .title{font:700 28px "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;fill:#172033}.head{font:700 22px "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;fill:#172033}.label{font:600 16px "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;fill:#172033}.small{font:500 14px "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;fill:#475569}.math{font:italic 19px Georgia,"Times New Roman",serif;fill:#172033}.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.yes{fill:#ecfdf5;stroke:#86efac}.no{fill:#f8fafc;stroke:#cbd5e1}
    </style>
  </defs>
  <rect width="1500" height="790" fill="#fff"/>
  <text x="750" y="48" text-anchor="middle" class="title">簡便法の違いは，内力の扱いと優先するつり合い条件にある</text>

  <g transform="translate(35 88)">
    <rect width="450" height="620" rx="18" class="panel"/>
    <text x="225" y="45" text-anchor="middle" class="head">Fellenius法</text>
    <text x="225" y="75" text-anchor="middle" class="small">スライス間力の効果を大幅に省略</text>
    <path d="M125 170 Q225 125 325 165 L320 370 L140 415Z" fill="#f4e7c5" stroke="#8b7355" stroke-width="3"/>
    <line x1="140" y1="415" x2="320" y2="370" stroke="#586174" stroke-width="5"/>
    <line x1="225" y1="210" x2="225" y2="320" stroke="#172033" stroke-width="5" marker-end="url(#black)"/><text x="239" y="264" class="math">W</text>
    <line x1="225" y1="392" x2="200" y2="320" stroke="#2563eb" stroke-width="5" marker-end="url(#blue)"/><text x="176" y="312" class="math" fill="#2563eb">N</text>
    <line x1="225" y1="392" x2="292" y2="375" stroke="#d64545" stroke-width="5" marker-end="url(#red)"/><text x="296" y="366" class="math" fill="#d64545">T</text>
    <line x1="104" y1="270" x2="152" y2="270" stroke="#94a3b8" stroke-width="4" stroke-dasharray="7 6"/><line x1="298" y1="270" x2="346" y2="270" stroke="#94a3b8" stroke-width="4" stroke-dasharray="7 6"/>
    <text x="85" y="254" class="math" fill="#64748b">E,X</text><text x="343" y="254" class="math" fill="#64748b">E,X</text>
    <line x1="94" y1="236" x2="118" y2="260" stroke="#d64545" stroke-width="3"/><line x1="118" y1="236" x2="94" y2="260" stroke="#d64545" stroke-width="3"/>
    <line x1="334" y1="236" x2="358" y2="260" stroke="#d64545" stroke-width="3"/><line x1="358" y1="236" x2="334" y2="260" stroke="#d64545" stroke-width="3"/>
    <rect x="50" y="462" width="350" height="58" rx="10" class="yes"/><text x="225" y="498" text-anchor="middle" class="label" fill="#14916a">円弧中心まわりの全体モーメント　✓</text>
    <rect x="50" y="535" width="350" height="58" rx="10" class="no"/><text x="225" y="571" text-anchor="middle" class="label">各スライスの力つり合い　—</text>
  </g>

  <g transform="translate(525 88)">
    <rect width="450" height="620" rx="18" class="panel"/>
    <text x="225" y="45" text-anchor="middle" class="head">Bishop簡便法</text>
    <text x="225" y="75" text-anchor="middle" class="small">Eを残し，Xを簡略化</text>
    <path d="M125 170 Q225 125 325 165 L320 370 L140 415Z" fill="#f4e7c5" stroke="#8b7355" stroke-width="3"/>
    <line x1="140" y1="415" x2="320" y2="370" stroke="#586174" stroke-width="5"/>
    <line x1="225" y1="210" x2="225" y2="320" stroke="#172033" stroke-width="5" marker-end="url(#black)"/><text x="239" y="264" class="math">W</text>
    <line x1="225" y1="392" x2="200" y2="320" stroke="#2563eb" stroke-width="5" marker-end="url(#blue)"/><text x="176" y="312" class="math" fill="#2563eb">N</text>
    <line x1="225" y1="392" x2="292" y2="375" stroke="#d64545" stroke-width="5" marker-end="url(#red)"/><text x="296" y="366" class="math" fill="#d64545">T</text>
    <line x1="100" y1="270" x2="160" y2="270" stroke="#14916a" stroke-width="5" marker-end="url(#green)"/><line x1="350" y1="270" x2="290" y2="270" stroke="#14916a" stroke-width="5" marker-end="url(#green)"/>
    <text x="94" y="251" class="math" fill="#14916a">E</text><text x="350" y="251" class="math" fill="#14916a">E</text>
    <line x1="140" y1="330" x2="140" y2="280" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 5"/><line x1="320" y1="280" x2="320" y2="330" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 5"/>
    <text x="104" y="340" class="small" fill="#64748b">Xを簡略化</text>
    <rect x="50" y="448" width="350" height="48" rx="10" class="yes"/><text x="225" y="478" text-anchor="middle" class="label" fill="#14916a">各スライスの鉛直力　✓</text>
    <rect x="50" y="507" width="350" height="48" rx="10" class="yes"/><text x="225" y="537" text-anchor="middle" class="label" fill="#14916a">全体モーメント　✓</text>
    <rect x="50" y="566" width="350" height="40" rx="10" class="no"/><text x="225" y="592" text-anchor="middle" class="small">全体水平力は一般に残る</text>
  </g>

  <g transform="translate(1015 88)">
    <rect width="450" height="620" rx="18" class="panel"/>
    <text x="225" y="45" text-anchor="middle" class="head">Janbu簡便法</text>
    <text x="225" y="75" text-anchor="middle" class="small">Xを簡略化し，力つり合いを重視</text>
    <path d="M125 170 Q225 125 325 165 L320 370 L140 415Z" fill="#f4e7c5" stroke="#8b7355" stroke-width="3"/>
    <line x1="140" y1="415" x2="320" y2="370" stroke="#586174" stroke-width="5"/>
    <line x1="225" y1="210" x2="225" y2="320" stroke="#172033" stroke-width="5" marker-end="url(#black)"/><text x="239" y="264" class="math">W</text>
    <line x1="225" y1="392" x2="200" y2="320" stroke="#2563eb" stroke-width="5" marker-end="url(#blue)"/><text x="176" y="312" class="math" fill="#2563eb">N</text>
    <line x1="225" y1="392" x2="292" y2="375" stroke="#d64545" stroke-width="5" marker-end="url(#red)"/><text x="296" y="366" class="math" fill="#d64545">T</text>
    <line x1="100" y1="270" x2="160" y2="270" stroke="#14916a" stroke-width="5" marker-end="url(#green)"/><line x1="350" y1="270" x2="290" y2="270" stroke="#14916a" stroke-width="5" marker-end="url(#green)"/>
    <text x="94" y="251" class="math" fill="#14916a">E</text><text x="350" y="251" class="math" fill="#14916a">E</text>
    <line x1="140" y1="330" x2="140" y2="280" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 5"/><line x1="320" y1="280" x2="320" y2="330" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 5"/>
    <text x="104" y="340" class="small" fill="#64748b">Xを簡略化</text>
    <rect x="50" y="462" width="350" height="58" rx="10" class="yes"/><text x="225" y="498" text-anchor="middle" class="label" fill="#14916a">全体の力つり合い　✓</text>
    <rect x="50" y="535" width="350" height="58" rx="10" class="no"/><text x="225" y="571" text-anchor="middle" class="label">全体モーメント　—</text>
  </g>
  <rect x="245" y="730" width="1010" height="40" rx="9" fill="#fff7ed" stroke="#fdba74"/>
  <text x="750" y="756" text-anchor="middle" class="label">「無視した力が存在しない」のではなく，解ける形にするため効果を省略・簡略化している</text>
</svg>
