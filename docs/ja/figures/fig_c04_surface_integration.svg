<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title desc">
  <title id="title">曲面の底面に働く表面力から，底面の合力へ</title>
  <desc id="desc">左は，曲面の底面に沿って分布する表面力の垂直成分とせん断成分．中は，各点の垂直力をベクトルとしてつないだ図で，向きを考えて足した合力は，大きさだけを足した値より短い．右は，LEMが底面を1つの平面と1つの向きで表し，合力 Ni と Ti を置いたモデル．</desc>
