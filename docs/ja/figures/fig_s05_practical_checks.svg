<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
  <title id="title">一般形状面と3Dの全体すべり方向を用いるLEMの確認フロー</title>
  <desc id="desc">手法名だけで判断せず，定式化，すべり面形状，三次元の全体すべり方向，つり合いと内力，数値収束，感度解析の順に確認し，説明可能な解析結果へ到達する流れ．</desc>
  <defs>
    <marker id="gray" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <marker id="green" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#14916a"/></marker>
    <style>
      .title{font:700 28px "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;fill:#172033}.head{font:700 19px "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;fill:#172033}.label{font:600 15px "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;fill:#172033}.small{font:500 13px "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;fill:#475569}.card{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.num{font:700 16px sans-serif;fill:#fff}
    </style>
  </defs>
  <rect width="1500" height="820" fill="#fff"/>
  <text x="750" y="48" text-anchor="middle" class="title">安全率の数値だけでなく，仮定・つり合い・収束・感度を順に確認する</text>

  <g transform="translate(55 100)">
    <rect width="390" height="230" rx="16" class="card"/><circle cx="34" cy="34" r="20" fill="#64748b"/><text x="34" y="40" text-anchor="middle" class="num">1</text><text x="195" y="42" text-anchor="middle" class="head">定式化</text>
    <text x="32" y="88" class="label">□ 原法か，一般化された「型」か</text>
    <text x="32" y="122" class="label">□ 無視・関数化する内力成分</text>
    <text x="32" y="156" class="label">□ 満足する力方向とモーメント軸</text>
    <text x="32" y="198" class="small">手法名ではなく実装内容を確認</text>
  </g>
  <line x1="457" y1="215" x2="525" y2="215" stroke="#64748b" stroke-width="5" marker-end="url(#gray)"/>
  <g transform="translate(545 100)">
    <rect width="390" height="230" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><circle cx="34" cy="34" r="20" fill="#d97706"/><text x="34" y="40" text-anchor="middle" class="num">2</text><text x="195" y="42" text-anchor="middle" class="head">すべり面形状</text>
    <text x="32" y="88" class="label">□ 円弧・楕円・複合・自由曲面</text>
    <text x="32" y="122" class="label">□ 法線力モーメントを含むか</text>
    <text x="32" y="156" class="label">□ 探索面族が機構を含むか</text>
    <text x="32" y="198" class="small">入力可能性と原法の保証を区別</text>
  </g>
  <line x1="947" y1="215" x2="1015" y2="215" stroke="#64748b" stroke-width="5" marker-end="url(#gray)"/>
  <g transform="translate(1035 100)">
    <rect width="410" height="230" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><circle cx="34" cy="34" r="20" fill="#7c3aed"/><text x="34" y="40" text-anchor="middle" class="num">3</text><text x="205" y="42" text-anchor="middle" class="head">3Dの全体すべり方向</text>
    <text x="32" y="88" class="label">□ 指定・対称面・探索・未知量</text>
    <text x="32" y="122" class="label">□ 全体方向から局所方向への写像</text>
    <text x="32" y="156" class="label">□ 面の主軸と同一視していないか</text>
    <text x="32" y="198" class="small">外力・非対称性で方向が変われるか</text>
  </g>

  <path d="M1240 342 V378 H250 V412" fill="none" stroke="#64748b" stroke-width="5" marker-end="url(#gray)"/>

  <g transform="translate(55 430)">
    <rect width="390" height="230" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><circle cx="34" cy="34" r="20" fill="#2563eb"/><text x="34" y="40" text-anchor="middle" class="num">4</text><text x="195" y="42" text-anchor="middle" class="head">つり合い・内力</text>
    <text x="32" y="88" class="label">□ 力・モーメント残差</text>
    <text x="32" y="122" class="label">□ 正の有効法線力と内力線</text>
    <text x="32" y="156" class="label">□ 側面抵抗の二重計上がないか</text>
    <text x="32" y="198" class="small">安全率以外の解も物理的か</text>
  </g>
  <line x1="457" y1="545" x2="525" y2="545" stroke="#64748b" stroke-width="5" marker-end="url(#gray)"/>
  <g transform="translate(545 430)">
    <rect width="390" height="230" rx="16" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/><circle cx="34" cy="34" r="20" fill="#d64545"/><text x="34" y="40" text-anchor="middle" class="num">5</text><text x="195" y="42" text-anchor="middle" class="head">数値解・探索</text>
    <text x="32" y="88" class="label">□ 残差と反復計算の収束</text>
    <text x="32" y="122" class="label">□ 非収束ケースの処理</text>
    <text x="32" y="156" class="label">□ 臨界面探索の局所解</text>
    <text x="32" y="198" class="small">「数値が返った」だけで終えない</text>
  </g>
  <line x1="947" y1="545" x2="1015" y2="545" stroke="#64748b" stroke-width="5" marker-end="url(#gray)"/>
  <g transform="translate(1035 430)">
    <rect width="410" height="230" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><circle cx="34" cy="34" r="20" fill="#14916a"/><text x="34" y="40" text-anchor="middle" class="num">6</text><text x="205" y="42" text-anchor="middle" class="head">感度・説明可能性</text>
    <text x="32" y="88" class="label">□ 分割数・方向・形状族</text>
    <text x="32" y="122" class="label">□ 内力関数・全体すべり方位</text>
    <text x="32" y="156" class="label">□ 複数手法・2D/3D比較</text>
    <text x="32" y="198" class="small">差の理由を力学的に説明できるか</text>
  </g>

  <line x1="1240" y1="672" x2="1240" y2="716" stroke="#14916a" stroke-width="5" marker-end="url(#green)"/>
  <rect x="985" y="730" width="510" height="58" rx="12" fill="#ecfdf5" stroke="#14916a" stroke-width="2"/>
  <text x="1240" y="766" text-anchor="middle" class="head" fill="#14916a">仮定と保証範囲を説明できる解析結果</text>
  <rect x="55" y="704" width="850" height="84" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="480" y="738" text-anchor="middle" class="label">いずれかで問題が見つかった場合</text>
  <text x="480" y="767" text-anchor="middle" class="small">入力・探索範囲・内力仮定・数値条件を見直し，前段階へ戻る</text>
</svg>
