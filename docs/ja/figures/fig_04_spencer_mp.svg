<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Spencer法とMorgenstern–Price法の内力方向仮定</title>
  <desc id="desc">Spencer法では全スライス境界の合力方向を一定とし，Morgenstern–Price法ではせん断力と法線力の比を位置関数で変化させることを比較する．</desc>
  <defs>
    <marker id="green" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#14916a"/></marker>
    <marker id="gray" viewBox="0 0 10 10" markerWidth="3" markerHeight="3" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      .title{font:700 28px "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;fill:#172033}.head{font:700 22px "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;fill:#172033}.label{font:600 17px "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;fill:#172033}.small{font:500 15px "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;fill:#475569}.math{font:italic 22px Georgia,"Times New Roman",serif;fill:#172033}.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}
    </style>
  </defs>
  <rect width="1400" height="760" fill="#fff"/>
  <text x="700" y="48" text-anchor="middle" class="title">内力を消すのではなく，方向関係を仮定して力とモーメントを満足させる</text>

  <rect x="45" y="86" width="620" height="600" rx="18" class="panel"/>
  <text x="355" y="128" text-anchor="middle" class="head">Spencer法：一定の内力傾斜</text>
  <path d="M105 385 Q350 220 605 330 L605 520 Q350 420 105 555Z" fill="#f4e7c5" stroke="#8b7355" stroke-width="3"/>
  <path d="M105 555 Q350 420 605 520" fill="none" stroke="#586174" stroke-width="5"/>
  <line x1="205" y1="318" x2="205" y2="486" stroke="#8b7355" stroke-width="2"/><line x1="305" y1="270" x2="305" y2="443" stroke="#8b7355" stroke-width="2"/><line x1="405" y1="251" x2="405" y2="447" stroke="#8b7355" stroke-width="2"/><line x1="505" y1="272" x2="505" y2="475" stroke="#8b7355" stroke-width="2"/>
  <g stroke="#14916a" stroke-width="6" marker-end="url(#green)">
    <line x1="205" y1="390" x2="268" y2="346"/><line x1="305" y1="372" x2="368" y2="328"/><line x1="405" y1="370" x2="468" y2="326"/><line x1="505" y1="390" x2="568" y2="346"/>
  </g>
  <line x1="175" y1="425" x2="262" y2="425" stroke="#64748b" stroke-width="2"/><path d="M235 425 A60 60 0 0 0 224 391" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#gray)"/>
  <text x="244" y="405" class="math">θ</text>
  <rect x="120" y="160" width="470" height="70" rx="11" fill="#fff" stroke="#cbd5e1"/>
  <text x="355" y="204" text-anchor="middle" class="math">X<tspan baseline-shift="sub" font-size="14">i</tspan> / E<tspan baseline-shift="sub" font-size="14">i</tspan> = tanθ = constant</text>
  <text x="355" y="586" text-anchor="middle" class="small">すべての境界合力が互いに平行</text>
  <rect x="130" y="615" width="450" height="44" rx="9" fill="#ecfdf5" stroke="#86efac"/>
  <text x="355" y="643" text-anchor="middle" class="label" fill="#14916a">全体の力つり合い ✓　＋　モーメントつり合い ✓</text>

  <rect x="735" y="86" width="620" height="600" rx="18" class="panel"/>
  <text x="1045" y="128" text-anchor="middle" class="head">Morgenstern–Price法：位置で変わる内力傾斜</text>
  <path d="M795 385 Q1040 220 1295 330 L1295 520 Q1040 420 795 555Z" fill="#f4e7c5" stroke="#8b7355" stroke-width="3"/>
  <path d="M795 555 Q1040 420 1295 520" fill="none" stroke="#586174" stroke-width="5"/>
  <line x1="895" y1="318" x2="895" y2="486" stroke="#8b7355" stroke-width="2"/><line x1="995" y1="270" x2="995" y2="443" stroke="#8b7355" stroke-width="2"/><line x1="1095" y1="251" x2="1095" y2="447" stroke="#8b7355" stroke-width="2"/><line x1="1195" y1="272" x2="1195" y2="475" stroke="#8b7355" stroke-width="2"/>
  <line x1="895" y1="390" x2="962" y2="365" stroke="#14916a" stroke-width="6" marker-end="url(#green)"/>
  <line x1="995" y1="372" x2="1058" y2="318" stroke="#14916a" stroke-width="6" marker-end="url(#green)"/>
  <line x1="1095" y1="370" x2="1151" y2="304" stroke="#14916a" stroke-width="6" marker-end="url(#green)"/>
  <line x1="1195" y1="390" x2="1263" y2="357" stroke="#14916a" stroke-width="6" marker-end="url(#green)"/>
  <rect x="810" y="160" width="470" height="70" rx="11" fill="#fff" stroke="#cbd5e1"/>
  <text x="1045" y="204" text-anchor="middle" class="math">X<tspan baseline-shift="sub" font-size="14">i</tspan> / E<tspan baseline-shift="sub" font-size="14">i</tspan> = λ f(x<tspan baseline-shift="sub" font-size="14">i</tspan>)</text>
  <g transform="translate(850 565)">
    <line x1="0" y1="0" x2="390" y2="0" stroke="#64748b" stroke-width="2" marker-end="url(#gray)"/>
    <path d="M15 0 C95 -55 185 -55 265 0 C305 24 340 20 375 -5" fill="none" stroke="#7c3aed" stroke-width="3"/>
    <text x="386" y="18" class="math">x</text><text x="185" y="-45" class="math" fill="#7c3aed">f(x)</text>
  </g>
  <rect x="820" y="615" width="450" height="44" rx="9" fill="#ecfdf5" stroke="#86efac"/>
  <text x="1045" y="643" text-anchor="middle" class="label" fill="#14916a">全体の力つり合い ✓　＋　モーメントつり合い ✓</text>
  <text x="700" y="728" text-anchor="middle" class="small">静力学的に完全でも，仮定した内力方向が唯一の連続体解であることまでは保証しない</text>
</svg>
