<svg xmlns="http://www.w3.org/2000/svg" width="760" height="362" viewBox="0 0 760 362" role="img" aria-labelledby="title desc">
  <title id="title">底面垂直力が負になる2つの原因（模式図）</title>
  <desc id="desc">鉛直方向のつり合いで，底面がスライスを上向きに支える力は底面垂直力の1次式になり，底面垂直力はその直線が自重の高さと交わる点で決まる．左のふつうのスライスでは，交点は正の側にある．中央の頭部のスライスでは，切片が自重を超えるので，交点は負の側にある．これは分子が負のときである．右の末端部のスライスでは，傾きが負なので，交点は負の側にある．これは分母が負のときである．</desc>
  <style>.t{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif}.m{font-family:'STIX Two Text','Cambria','Times New Roman',serif}</style>
