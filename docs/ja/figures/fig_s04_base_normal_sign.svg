  <polygon points="32,146 120,146 120,306 32,306" fill="#fdf0ef" stroke-linejoin="round"/>
  <text x="38" y="163" class="m" font-size="13" fill="#b45309" text-anchor="start"><tspan font-style="italic">N</tspan><tspan dy="3.6" font-size="9.1" font-style="italic">i</tspan><tspan dy="-3.6" font-style="normal"> &lt; 0</tspan></text>
  <line x1="32" y1="270.4" x2="208" y2="270.4" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="120" y1="146" x2="120" y2="306" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/>
  <text x="212" y="275.4" class="m" font-size="14" fill="#475569" text-anchor="start"><tspan font-style="italic">N</tspan><tspan dy="3.9" font-size="9.8" font-style="italic">i</tspan></text>
  <text x="120" y="138" class="t" font-size="13" fill="#475569" text-anchor="middle">上向きの力</text>
