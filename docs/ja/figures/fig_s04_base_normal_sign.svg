  <circle cx="169.3" cy="190.4" r="5.5" fill="#2563eb"/>
  <text x="127" y="293.6" class="m" font-size="13" fill="#172033" text-anchor="start"><tspan font-style="normal" class="t" font-size="13">傾き </tspan><tspan font-style="italic">m</tspan><tspan dy="3.6" font-size="9.1" font-style="italic">α</tspan><tspan font-size="9.1" font-style="normal">,</tspan><tspan font-size="9.1" font-style="italic">i</tspan><tspan dy="-3.6" font-style="normal"> &gt; 0</tspan></text>
