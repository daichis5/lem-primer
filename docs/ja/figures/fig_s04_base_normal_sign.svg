  <text x="380" y="336" class="m" font-size="14" fill="#172033" text-anchor="middle"><tspan font-style="normal" class="t" font-size="14">交点は </tspan><tspan font-style="italic">N</tspan><tspan dy="3.9" font-size="9.8" font-style="italic">i</tspan><tspan dy="-3.9" font-style="normal"> &lt; 0</tspan></text>
