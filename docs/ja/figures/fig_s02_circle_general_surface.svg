<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title desc">
  <title id="title">円弧のすべり面と楕円のすべり面での，底面垂直力の向き</title>
  <desc id="desc">左の円弧では，底面垂直力の作用線がすべて中心 O を通るので，O まわりのモーメントは0になる．底面のせん断力の腕は，どれも半径 R である．右の楕円では，作用線が中心 O′ を通らない．そのため，底面垂直力は O′ まわりに腕 d をもつ．また，接線の方向が，O′ まわりに回転したときに底面の点が動く方向と，一般に一致しない．</desc>
